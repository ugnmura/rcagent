[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rcagent"
version = "0.1.0"
description = "RCAgent: MCP server for root cause analysis over logs in SereneDB"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.9,<2",
    "psycopg[binary]",
    "drain3",
    "sqlglot",
    "pyarrow>=26.0.0",
    "google-re2>=1.1.20251105",
]

[project.scripts]
rcagent = "serenedb_extractor.server:main"
serenedb-extractor = "serenedb_extractor.server:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["src/serenedb_extractor"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "db: needs a SereneDB at SERENEDB_TEST_URL",
]

[tool.mypy]
files = ["src", "tests"]
check_untyped_defs = true
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true
