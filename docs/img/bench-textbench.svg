<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 232" width="900" height="232" role="img" aria-label="TextBench, 1 billion rows read in place on S3, seconds per call: search of the whole file with the index 4.18 s, exact search of one minute without an index 2.88 s, survey of message types from a block sample 7.8 s. The index was built once in 69.9 s and needs over 64 GB of RAM." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <style>
    .t1 { fill: #0b0b0b; }
    .t2 { fill: #52514e; }
    .bar { fill: #2a78d6; }
    .grid { stroke: #e4e3df; }
    .axis { stroke: #b8b7b1; }
    @media (prefers-color-scheme: dark) {
      .t1 { fill: #ffffff; }
      .t2 { fill: #c3c2b7; }
      .bar { fill: #3987e5; }
      .grid { stroke: #33332f; }
      .axis { stroke: #5c5b55; }
    }
    text { font-size: 13px; }
    .title { font-size: 15px; font-weight: 600; }
    .grp { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; }
    .val { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .tick { font-size: 11.5px; font-variant-numeric: tabular-nums; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; font-size: 12px; }
  </style>

  <text x="20" y="28" class="t1 title">TextBench: 1 billion rows, read in place on S3</text>
  <text x="20" y="48" class="t2">seconds per call · one shared 16-CPU / 128 GB node · median of 3 for searches</text>

  <g class="grid" stroke-width="1">
    <line x1="340" y1="68" x2="340" y2="168" class="axis"/>
    <line x1="440" y1="68" x2="440" y2="168"/>
    <line x1="540" y1="68" x2="540" y2="168"/>
    <line x1="640" y1="68" x2="640" y2="168"/>
    <line x1="740" y1="68" x2="740" y2="168"/>
    <line x1="840" y1="68" x2="840" y2="168"/>
  </g>
  <g class="t2 tick" text-anchor="middle">
    <text x="340" y="186">0</text>
    <text x="440" y="186">2</text>
    <text x="540" y="186">4</text>
    <text x="640" y="186">6</text>
    <text x="740" y="186">8</text>
    <text x="840" y="186">10 s</text>
  </g>

  <text x="20" y="92" class="t1">Search the whole file, with index*</text>
  <rect x="340" y="78" width="209.0" height="20" rx="4" class="bar"/><rect x="340" y="78" width="4" height="20" class="bar"/>
  <text x="557.0" y="93" class="t1 val">4.18 s</text>

  <text x="20" y="122" class="t1">Search one minute, no index</text>
  <rect x="340" y="108" width="144.0" height="20" rx="4" class="bar"/><rect x="340" y="108" width="4" height="20" class="bar"/>
  <text x="492.0" y="123" class="t1 val">2.88 s</text>

  <text x="20" y="152" class="t1">Survey message types (block sample)</text>
  <rect x="340" y="138" width="390.0" height="20" rx="4" class="bar"/><rect x="340" y="138" width="4" height="20" class="bar"/>
  <text x="738.0" y="153" class="t1 val">7.8 s</text>

  <text x="20" y="216" class="t2 tick">* index built once in 69.9 s, needs over 64 GB of RAM</text>
</svg>
