<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="TextBench, 1 billion rows read in place on S3. Per question: search of the whole file with the index 4.18 s, exact search of a 60-second window without an index 2.88 s, survey from a block sample 7.8 s. One-off: registering the S3 file 1.97 s, building the search index over all rows 69.9 s." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <style>
    .t1 { fill: #0b0b0b; }
    .t2 { fill: #52514e; }
    .bar { fill: #2a78d6; }
    .grid { stroke: #e4e3df; }
    .axis { stroke: #b8b7b1; }
    @media (prefers-color-scheme: dark) {
      .t1 { fill: #ffffff; }
      .t2 { fill: #c3c2b7; }
      .bar { fill: #3987e5; }
      .grid { stroke: #33332f; }
      .axis { stroke: #5c5b55; }
    }
    text { font-size: 13px; }
    .title { font-size: 15px; font-weight: 600; }
    .grp { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; }
    .val { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .tick { font-size: 11.5px; font-variant-numeric: tabular-nums; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; font-size: 12px; }
  </style>

  <text x="20" y="28" class="t1 title">TextBench: 1 billion rows, read in place on S3</text>
  <text x="20" y="48" class="t2">seconds per call · one shared 16-CPU / 128 GB node · median of 3 for searches</text>

  <!-- plot: x0=340, 0..70 s over 500 px → 7.142857 px/s -->
  <g class="grid" stroke-width="1">
    <line x1="340" y1="68" x2="340" y2="292" class="axis"/>
    <line x1="411.4" y1="68" x2="411.4" y2="292"/>
    <line x1="482.9" y1="68" x2="482.9" y2="292"/>
    <line x1="554.3" y1="68" x2="554.3" y2="292"/>
    <line x1="625.7" y1="68" x2="625.7" y2="292"/>
    <line x1="697.1" y1="68" x2="697.1" y2="292"/>
    <line x1="768.6" y1="68" x2="768.6" y2="292"/>
    <line x1="840" y1="68" x2="840" y2="292"/>
  </g>
  <g class="t2 tick" text-anchor="middle">
    <text x="340" y="310">0</text>
    <text x="411.4" y="310">10</text>
    <text x="482.9" y="310">20</text>
    <text x="554.3" y="310">30</text>
    <text x="625.7" y="310">40</text>
    <text x="697.1" y="310">50</text>
    <text x="768.6" y="310">60</text>
    <text x="840" y="310">70 s</text>
  </g>

  <!-- per question -->
  <text x="20" y="84" class="t2 grp">EACH QUESTION</text>

  <text x="20" y="110" class="t1">Search the whole file, with index</text>
  <rect x="340" y="96" width="29.9" height="20" rx="4" class="bar"/><rect x="340" y="96" width="4" height="20" class="bar"/>
  <text x="377.9" y="111" class="t1 val">4.18 s</text>

  <text x="20" y="140" class="t1">Search a 60 s window, no index</text>
  <rect x="340" y="126" width="20.6" height="20" rx="4" class="bar"/><rect x="340" y="126" width="4" height="20" class="bar"/>
  <text x="368.6" y="141" class="t1 val">2.88 s</text>

  <text x="20" y="170" class="t1">Survey message types (block sample)</text>
  <rect x="340" y="156" width="55.7" height="20" rx="4" class="bar"/><rect x="340" y="156" width="4" height="20" class="bar"/>
  <text x="403.7" y="171" class="t1 val">7.8 s</text>

  <!-- one-off -->
  <text x="20" y="208" class="t2 grp">ONCE</text>

  <text x="20" y="234" class="t1">Register the S3 file (nothing downloaded)</text>
  <rect x="340" y="220" width="14.1" height="20" rx="4" class="bar"/><rect x="340" y="220" width="4" height="20" class="bar"/>
  <text x="362.1" y="235" class="t1 val">1.97 s</text>

  <text x="20" y="264" class="t1">Build the search index over all rows</text>
  <rect x="340" y="250" width="499.3" height="20" rx="4" class="bar"/><rect x="340" y="250" width="4" height="20" class="bar"/>
  <text x="831.3" y="265" class="val" text-anchor="end" fill="#ffffff">69.9 s</text>
</svg>
